name: Tag official plugins 1.6 and start release
on:
  push:
    branches: [master]
    paths: ['.github/workflows/tag-plugins-1-6-once.yml']

permissions:
  contents: write
  actions: write

jobs:
  tag-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag exactly the green plugins PR merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target=d485d702079d9b54285cf83ce9ae4534e88b70f3
          test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/152" --jq .merge_commit_sha)" = "$target"
          git cat-file -e "$target^{commit}"
          git merge-base --is-ancestor "$target" HEAD
          git fetch --force --tags origin
          if git rev-parse -q --verify refs/tags/1.6 >/dev/null; then
            test "$(git rev-list -n1 refs/tags/1.6)" = "$target" || {
              echo "::error::Tag 1.6 already exists at a different revision"
              exit 1
            }
          else
            git config user.name github-actions
            git config user.email github-actions@users.noreply.github.com
            git tag -a 1.6 "$target" -m "Official Psi plugins 1.6 (Qt 6.12, QCA 3.0.12)"
            git push origin refs/tags/1.6:refs/tags/1.6
          fi
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/1.6" --jq .object.sha)"
          type="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/1.6" --jq .object.type)"
          if [ "$type" = tag ]; then
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$ref" --jq .object.sha)"
          fi
          test "$ref" = "$target"

      - name: Dispatch asset-validated GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f tag=1.6
          echo 'Started official plugins 1.6 release.'
