name: qca-otr

on:
  pull_request:
    paths:
      - 'generic/otrplugin/qca-otr/**'
      - '.github/workflows/qca-otr.yml'
  push:
    branches:
      - master
    paths:
      - 'generic/otrplugin/qca-otr/**'
      - '.github/workflows/qca-otr.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  QCA_VERSION: 3.0.5

jobs:
  test:
    name: Qt ${{ matrix.qt }} / Linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        qt: ['5', '6']

    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          if [[ '${{ matrix.qt }}' == '6' ]]; then
            sudo apt-get install -y cmake ninja-build pkg-config qt6-base-dev libssl-dev libotr5-dev unzip curl
          else
            sudo apt-get install -y cmake ninja-build pkg-config qtbase5-dev libssl-dev libotr5-dev
          fi

      - name: Install released QCA3 Qt6 packages
        if: matrix.qt == '6'
        shell: bash
        run: |
          set -euo pipefail
          mkdir qca-packages
          curl -fL \
            "https://github.com/psi-im/qca/releases/download/v${QCA_VERSION}/qca3-deb-ubuntu-24.04.zip" \
            -o qca3.zip
          unzip -q qca3.zip -d qca-packages
          sudo apt-get install -y ./qca-packages/*.deb

          plugin_dir=$(find /usr/lib -type d -path '*/qca3-qt6/crypto' -print -quit)
          test -n "$plugin_dir"
          echo "QCA_PLUGIN_PATH=$(dirname "$plugin_dir")" >> "$GITHUB_ENV"

      - name: Checkout QCA3 for Qt5
        if: matrix.qt == '5'
        uses: actions/checkout@v4
        with:
          repository: psi-im/qca
          ref: v${{ env.QCA_VERSION }}
          path: qca

      - name: Build and install QCA3 Qt5
        if: matrix.qt == '5'
        shell: bash
        run: |
          cmake -S qca -B qca-build -G Ninja \
            -DBUILD_WITH_QT6=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_TOOLS=OFF \
            -DBUILD_PLUGINS=ossl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/qca-install"
          cmake --build qca-build
          cmake --install qca-build

          echo "QCA_PREFIX=$PWD/qca-install" >> "$GITHUB_ENV"
          echo "QCA_PLUGIN_PATH=$PWD/qca-install/lib/qca3-qt5" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$PWD/qca-install/lib" >> "$GITHUB_ENV"

      - name: Build qca-otr
        shell: bash
        run: |
          cmake_args=(
            -S generic/otrplugin/qca-otr
            -B qca-otr-build
            -G Ninja
            -DQT_DEFAULT_MAJOR_VERSION='${{ matrix.qt }}'
            -DQCA_OTR_BUILD_LIBOTR_INTEROP_TESTS=ON
            -DCMAKE_BUILD_TYPE=Release
          )
          if [[ -n "${QCA_PREFIX:-}" ]]; then
            cmake_args+=("-DCMAKE_PREFIX_PATH=$QCA_PREFIX")
          fi
          cmake "${cmake_args[@]}"
          cmake --build qca-otr-build

      - name: Run qca-otr tests
        shell: bash
        run: ctest --test-dir qca-otr-build --output-on-failure

  windows-qt5:
    name: Qt 5 / Windows 7 baseline
    runs-on: windows-2022
    steps:
      - name: Checkout plugins
        uses: actions/checkout@v4

      - name: Set up MSYS2 MINGW64 Qt5
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt5-base
            mingw-w64-x86_64-openssl
            curl
            unzip

      - name: Download released QCA3 Qt5 SDK
        shell: msys2 {0}
        run: |
          set -euo pipefail
          curl -fL \
            "https://github.com/psi-im/qca/releases/download/v${QCA_VERSION}/qca3-qt5-windows-x64.zip" \
            -o qca3-qt5.zip
          mkdir qca-sdk
          unzip -q qca3-qt5.zip -d qca-sdk
          test -f qca-sdk/lib/cmake/Qca3-qt5/Qca3-qt5Config.cmake
          test -n "$(find qca-sdk/bin -type f -iname '*qca3-qt5*.dll' -print -quit)"
          plugin_root="$PWD/qca-sdk/lib/qca3-qt5"
          test -d "$plugin_root/crypto"
          echo "QCA_PLUGIN_PATH=$(cygpath -w "$plugin_root")" >> "$GITHUB_ENV"

      - name: Build and run qca-otr native tests
        shell: msys2 {0}
        run: |
          set -euo pipefail
          export PATH="$PWD/qca-sdk/bin:$PATH"
          cmake -S generic/otrplugin/qca-otr -B qca-otr-build -G Ninja \
            -DQT_DEFAULT_MAJOR_VERSION=5 \
            -DQCA_OTR_BUILD_LIBOTR_INTEROP_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_PREFIX_PATH=$PWD/qca-sdk;/mingw64" \
            "-DQca3-qt5_DIR=$PWD/qca-sdk/lib/cmake/Qca3-qt5"
          cmake --build qca-otr-build --parallel 2
          ctest --test-dir qca-otr-build --output-on-failure
